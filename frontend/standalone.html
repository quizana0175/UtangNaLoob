                    className="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl text-xs font-bold disabled:opacity-50"
                  >
                    {submitting ? 'Approving...' : `✓ Approve ₱${Number(customLimit).toLocaleString()} Limit`}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Reject Reason Modal */}
          {rejectTarget && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-800/50 rounded-3xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">Reject KYC Application</h3>
                  <button onClick={() => setRejectTarget(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <div className="mb-4 p-3 bg-slate-950 rounded-xl">
                  <div className="text-sm font-semibold text-white">{rejectTarget.firstName} {rejectTarget.lastName}</div>
                  <div className="text-xs text-slate-400">{rejectTarget.email} • Income: ₱{(rejectTarget.monthlyIncome || 0).toLocaleString()}</div>
                </div>
                <form onSubmit={handleRejectSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Rejection Reason *</label>
                    <textarea
                      required rows={3} value={rejectReason}
                      onChange={(e) => setRejectReason(e.target.value)}
                      placeholder="e.g. Insufficient income verification documents. Declared income does not match submitted payslip."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-sm resize-none"
                    />
                  </div>
                  <div className="flex justify-end space-x-2">
                    <button type="button" onClick={() => setRejectTarget(null)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs">Cancel</button>
                    <button type="submit" disabled={submitting || !rejectReason.trim()} className="px-4 py-2 bg-rose-700 hover:bg-rose-600 text-white font-bold rounded-lg text-xs disabled:opacity-50">
                      {submitting ? 'Submitting...' : 'Confirm Rejection'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Admin Dashboard View

    // Reset Password View
    function ResetPasswordView({ onNavigate }) {
      const [token, setToken] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      useEffect(() => {
        const fullHash = window.location.hash || '';
        if (fullHash.includes('token=')) {
          const parts = fullHash.split('token=');
          if (parts[1]) setToken(decodeURIComponent(parts[1].split('&')[0]));
        }
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(''); setSuccess('');
        if (!token.trim()) { setError('Please provide a reset token.'); return; }
        if (newPassword.length < 6) { setError('Password must be at least 6 characters.'); return; }
        if (newPassword !== confirmPassword) { setError('Passwords do not match.'); return; }
        setLoading(true);
        try {
          const res = await authApi.resetPassword({ token: token.trim(), newPassword, confirmPassword });
          setSuccess(res.message || 'Password reset successfully!');
          setTimeout(() => onNavigate('/login'), 2000);
        } catch (err) {
          setError(err.message || 'Password reset failed.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-[80vh] flex items-center justify-center py-12 px-4">
          <div className="max-w-md w-full space-y-6 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
            <div className="text-center">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-black text-2xl text-slate-950 mb-3">&#128272;</div>
              <h2 className="text-2xl font-extrabold text-white">Set New Password</h2>
              <p className="mt-1 text-sm text-slate-400">Submit your verification token and your new chosen password</p>
            </div>

            {error && <div className="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm">{error}</div>}
            {success && <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-sm">{success} Redirecting to sign in...</div>}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Verification Token</label>
                <input
                  type="text" required value={token} onChange={(e) => setToken(e.target.value)}
                  placeholder="Enter token"
                  className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">New Password (min 6 chars)</label>
                <input
                  type="password" required value={newPassword} onChange={(e) => setNewPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Confirm New Password</label>
                <input
                  type="password" required value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
              </div>
              <button
                type="submit" disabled={loading}
                className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold rounded-xl transition disabled:opacity-50"
              >
                {loading ? 'Saving...' : 'Save New Password'}
              </button>
            </form>

            <div className="pt-4 border-t border-slate-800 text-center text-sm">
              <button type="button" onClick={() => onNavigate('/login')} className="text-emerald-400">&larr; Back to Sign In</button>
            </div>
          </div>
        </div>
      );
    }

    // Profile Management View
    function ProfileView({ onNavigate }) {
      const { user: authUser, getDashboardRoute } = useAuth();
      const [activeTab, setActiveTab] = useState('profile');
      const [profile, setProfile] = useState(null);
      const [formData, setFormData] = useState({
        firstName: '', lastName: '', phoneNumber: '', dateOfBirth: '',
        address: '', employmentStatus: 'EMPLOYED', monthlyIncome: 0
      });
      const [profileLoading, setProfileLoading] = useState(true);
      const [profileSaving, setProfileSaving] = useState(false);
      const [profileMsg, setProfileMsg] = useState({ type: '', text: '' });

      const [passwordData, setPasswordData] = useState({ currentPassword: '', newPassword: '', confirmPassword: '' });
      const [passwordSaving, setPasswordSaving] = useState(false);
      const [passwordMsg, setPasswordMsg] = useState({ type: '', text: '' });

      useEffect(() => { loadProfile(); }, []);

      const loadProfile = async () => {
        setProfileLoading(true);
        try {
          const data = await userApi.getProfile();
          setProfile(data);
          setFormData({
            firstName: data.firstName || '',
            lastName: data.lastName || '',
            phoneNumber: data.phoneNumber || '',
            dateOfBirth: data.dateOfBirth || '',
            address: data.address || '',
            employmentStatus: data.employmentStatus || 'EMPLOYED',
            monthlyIncome: data.monthlyIncome || 0
          });
        } catch (err) {
          setProfileMsg({ type: 'error', text: err.message || 'Failed to load profile.' });
        } finally {
          setProfileLoading(false);
        }
      };

      const handleProfileSubmit = async (e) => {
        e.preventDefault();
        setProfileMsg({ type: '', text: '' });
        setProfileSaving(true);
        try {
          const updated = await userApi.updateProfile(formData);
          setProfile(updated);
          setProfileMsg({ type: 'success', text: 'Profile updated successfully in the database!' });
        } catch (err) {
          setProfileMsg({ type: 'error', text: err.message || 'Update failed.' });
        } finally {
          setProfileSaving(false);
        }
      };

      const handlePasswordSubmit = async (e) => {
        e.preventDefault();
        setPasswordMsg({ type: '', text: '' });
        if (passwordData.newPassword.length < 6) {
          setPasswordMsg({ type: 'error', text: 'New password must be at least 6 characters.' });
          return;
        }
        if (passwordData.newPassword !== passwordData.confirmPassword) {
          setPasswordMsg({ type: 'error', text: 'New password and confirmation do not match.' });
          return;
        }
        setPasswordSaving(true);
        try {
          const res = await authApi.changePassword(passwordData);
          setPasswordMsg({ type: 'success', text: res.message || 'Password changed successfully!' });
          setPasswordData({ currentPassword: '', newPassword: '', confirmPassword: '' });
        } catch (err) {
          setPasswordMsg({ type: 'error', text: err.message || 'Failed to change password.' });
        } finally {
          setPasswordSaving(false);
        }
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <div className="flex justify-between items-center pb-6 border-b border-slate-800">
            <div>
              <h1 className="text-3xl font-extrabold text-white">User Profile & Security</h1>
              <p className="text-sm text-slate-400 mt-1">Manage profile parameters, address, income, and change password</p>
            </div>
            <button
              onClick={() => onNavigate(getDashboardRoute())}
              className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium border border-slate-700"
            >
              &larr; Dashboard
            </button>
          </div>

          <div className="flex space-x-2 mt-6 border-b border-slate-800">
            <button
              onClick={() => setActiveTab('profile')}
              className={`px-5 py-3 font-semibold text-sm border-b-2 transition ${activeTab === 'profile' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}`}
            >
              Profile Information
            </button>
            <button
              onClick={() => setActiveTab('password')}
              className={`px-5 py-3 font-semibold text-sm border-b-2 transition ${activeTab === 'password' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}`}
            >
              Change Password
            </button>
          </div>

          {activeTab === 'profile' && (
            <div className="mt-6 space-y-6">
              {profileMsg.text && (
                <div className={`p-4 rounded-xl text-sm ${profileMsg.type === 'success' ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300' : 'bg-rose-500/10 border border-rose-500/30 text-rose-300'}`}>
                  {profileMsg.text}
                </div>
              )}

              {profileLoading ? (
                <div className="text-center py-12 text-slate-400">Loading profile...</div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 h-fit">
                    <div className="flex items-center space-x-3">
                      <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-lg text-slate-950">
                        {formData.firstName?.[0] || 'U'}{formData.lastName?.[0] || ''}
                      </div>
                      <div>
                        <div className="font-bold text-white">{formData.firstName} {formData.lastName}</div>
                        <div className="text-xs text-slate-400">{profile?.email}</div>
                      </div>
                    </div>
                    <div className="border-t border-slate-800 pt-3 space-y-2 text-xs">
                      <div className="flex justify-between"><span className="text-slate-400">Roles:</span><span className="text-white font-medium">{profile?.roles?.join(', ')}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">KYC:</span><span className="text-amber-400 font-medium">{profile?.kycStatus || 'NOT_SUBMITTED'}</span></div>
                      {profile?.approvedCreditLimit !== undefined && (
                        <div className="flex justify-between"><span className="text-slate-400">Credit Limit:</span><span className="text-emerald-400 font-bold">₱{Number(profile.approvedCreditLimit).toLocaleString()}</span></div>
                      )}
                    </div>
                  </div>

                  <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6">
                    <form onSubmit={handleProfileSubmit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">First Name *</label>
                          <input
                            type="text" required value={formData.firstName}
                            onChange={(e) => setFormData({ ...formData, firstName: e.target.value })}
                            className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Last Name *</label>
                          <input
                            type="text" required value={formData.lastName}
                            onChange={(e) => setFormData({ ...formData, lastName: e.target.value })}
                            className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Email (Permanent Identifier)</label>
                        <input type="email" disabled value={profile?.email || ''} className="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-500 cursor-not-allowed" />
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Phone Number</label>
                          <input
                            type="text" value={formData.phoneNumber}
                            onChange={(e) => setFormData({ ...formData, phoneNumber: e.target.value })}
                            placeholder="09171234567"
                            className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Date of Birth</label>
                          <input
                            type="date" value={formData.dateOfBirth}
                            onChange={(e) => setFormData({ ...formData, dateOfBirth: e.target.value })}
                            className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Address</label>
                        <textarea
                          rows="2" value={formData.address}
                          onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                          className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        />
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Employment Status</label>
                          <select
                            value={formData.employmentStatus}
                            onChange={(e) => setFormData({ ...formData, employmentStatus: e.target.value })}
                            className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          >
                            <option value="EMPLOYED">Employed</option>
                            <option value="SELF_EMPLOYED">Self-Employed</option>
                            <option value="FREELANCER">Freelancer</option>
                            <option value="UNEMPLOYED">Unemployed</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Monthly Income (₱)</label>
                          <input
                            type="number" min="0" step="1000" value={formData.monthlyIncome}
                            onChange={(e) => setFormData({ ...formData, monthlyIncome: parseFloat(e.target.value) || 0 })}
                            className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                      </div>

                      <div className="pt-3 flex justify-end">
                        <button
                          type="submit" disabled={profileSaving}
                          className="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold rounded-xl transition disabled:opacity-50"
                        >
                          {profileSaving ? 'Saving...' : 'Save Profile Changes'}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          )}

          {activeTab === 'password' && (
            <div className="mt-6 max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-5">
              <h3 className="text-xl font-bold text-white">Change Account Password</h3>

              {passwordMsg.text && (
                <div className={`p-4 rounded-xl text-sm ${passwordMsg.type === 'success' ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300' : 'bg-rose-500/10 border border-rose-500/30 text-rose-300'}`}>
                  {passwordMsg.text}
                </div>
              )}

              <form onSubmit={handlePasswordSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Current Password *</label>
                  <input
                    type="password" required value={passwordData.currentPassword}
                    onChange={(e) => setPasswordData({ ...passwordData, currentPassword: e.target.value })}
                    className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">New Password * (min 6 chars)</label>
                  <input
                    type="password" required value={passwordData.newPassword}
                    onChange={(e) => setPasswordData({ ...passwordData, newPassword: e.target.value })}
                    className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Confirm New Password *</label>
                  <input
                    type="password" required value={passwordData.confirmPassword}
                    onChange={(e) => setPasswordData({ ...passwordData, confirmPassword: e.target.value })}
                    className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>
                <button
                  type="submit" disabled={passwordSaving}
                  className="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold rounded-xl transition disabled:opacity-50"
                >
                  {passwordSaving ? 'Updating...' : 'Update Password'}
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // Main App
    function App() {
      const [currentPath, setCurrentPath] = useState(() => window.location.hash.replace('#', '') || '/login');

      useEffect(() => {
        const onHash = () => setCurrentPath(window.location.hash.replace('#', '') || '/login');
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigate = (p) => {
        window.location.hash = p;
        setCurrentPath(p);
      };

      const renderView = () => {
        const basePath = currentPath.split('?')[0];
        switch (basePath) {
          case '/login': return <LoginView onNavigate={navigate} />;
          case '/register': return <RegisterView onNavigate={navigate} />;
          case '/forgot-password': return <ForgotPasswordView onNavigate={navigate} />;
          case '/reset-password': return <ResetPasswordView onNavigate={navigate} />;
          case '/profile': return <ProfileView onNavigate={navigate} />;
          case '/dashboard/borrower': return <BorrowerDashboardView onNavigate={navigate} />;
          case '/dashboard/underwriter': return <UnderwriterDashboardView onNavigate={navigate} />;
          case '/dashboard/admin': return <AdminDashboardView onNavigate={navigate} />;
          default: return <LoginView onNavigate={navigate} />;
        }
      };

      return (
        <AuthProvider>
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
            <Navbar currentPath={currentPath} onNavigate={navigate} />
            <main className="flex-1 pb-12">{renderView()}</main>
            <footer className="border-t border-slate-900 bg-slate-950/80 py-4 text-center text-xs text-slate-500">
              © 2026 Utang na Loob: Automated Micro-Lending & Transparent Repayment Tracking Platform
            </footer>
          </div>
        </AuthProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
