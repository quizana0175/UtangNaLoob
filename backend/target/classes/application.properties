# Utang na Loob - Micro-Lending Application Configuration
spring.application.name=utangnaloob-backend
server.port=8080

# Default Datasource - PostgreSQL
# Change via environment variables or run with: --spring.datasource.url=...
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/utangnaloob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
utangnaloob.app.jwtSecret=UtangNaLoobVerySecureSecretKey2026WithSufficientBitLengthForHS512AlgorithmSecurityStandard
utangnaloob.app.jwtExpirationMs=86400000

# Server compression & encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# File upload limits (for KYC documents)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
